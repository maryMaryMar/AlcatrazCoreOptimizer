# ----------------------------------------------------------
# 20. MÓDULO: DEFENSA DE BOSSES (PROYECTILES Y ESPADAS)
# ----------------------------------------------------------
boss-defense:
  enabled: true

  # 1. Defensa contra Proyectiles (Flechas, Tridentes, Cargas de Viento, etc.)
  projectile:
    enabled: true
    # Porcentaje de reducción de daño (75.0 = absorbe el 75%, recibe el 25%)
    reduction-percentage: 75.0
    # Incluir pociones arrojadizas (Splash/Lingering) en la reducción
    include-potions: false

  # 2. Defensa contra Espadas y Armas Cuerpo a Cuerpo
  sword:
    enabled: true
    # Porcentaje de reducción de daño (75.0 = absorbe el 75%, recibe el 25%)
    reduction-percentage: 75.0
    # Aplicar a espadas (Madera, Piedra, Hierro, Oro, Diamante, Netherite)
    apply-to-swords: true
    # Aplicar a hachas
    apply-to-axes: true
    # Aplicar a mazos
    apply-to-maces: true
    # Aplicar a cualquier ataque cuerpo a cuerpo (incluso sin espada)
    apply-to-all-melee: false

  # 3. Notificación / Cartel en Pantalla al Atacante
  notification:
    # Activa o desactiva por completo el cartel/aviso en pantalla al golpear al boss
    enabled: true
    # Tipo de visualización:
    #  - "ACTIONBAR" (Texto flotante sobre la barra de objetos)
    #  - "TITLE" (Texto grande centrado en medio de la pantalla)
    #  - "CHAT" (Mensaje enviado al chat del jugador)
    display-type: "ACTIONBAR"
    # Mensaje para impactos con proyectiles y flechas
    message-projectile: "&c🛡 &e¡El Jefe absorbe el &6%percentage%%% &ede daño por proyectiles! &7(-%reduction%%%)"
    # Mensaje para impactos con espada o cuerpo a cuerpo
    message-sword: "&c🛡 &e¡El Jefe absorbe el &6%percentage%%% &ede daño de tu espada! &7(-%reduction%%%)"
    # Configuración adicional en caso de elegir display-type: "TITLE"
    title:
      title: "&c🛡 &l¡ESCUDO DE JEFE!"
      subtitle: "&eAbsorbió el &6%percentage%%% &ede daño"
      fade-in-ticks: 5
      stay-ticks: 25
      fade-out-ticks: 5
    # Tiempo mínimo entre avisos al mismo jugador (segundos) para evitar spam
    cooldown-seconds: 1.5

  # Efectos visuales y de sonido al impactar
  sound:
    enabled: true
    sound-type: "ITEM_SHIELD_BLOCK"
    volume: 1.0
    pitch: 1.25
  particles:
    enabled: true
    particle-type: "ENCHANTED_HIT"
    count: 15
    offset-x: 0.4
    offset-y: 0.6
    offset-z: 0.4
    speed: 0.1

  # Criterios para identificar a un Boss / Jefe de Dungeon:
  detection:
    # 1. Tags de scoreboard aplicables con vanilla (/tag @e[distance=..5] add boss)
    scoreboard-tags:
      - "boss"
      - "dungeon_boss"
      - "dungeon"
      - "jefe"
      - "jefe_mazmorra"
      - "miniboss"
      - "boss_dungeon"

    # 2. Palabras clave en el nombre visible de la entidad (ignora mayúsculas y colores)
    name-keywords:
      - "boss"
      - "jefe"
      - "rey"
      - "lord"
      - "guardian"
      - "guardián"
      - "warden"
      - "centinela"
      - "dungeon"
      - "mazmorra"
      - "titán"
      - "titan"
      - "coloso"
      - "devorador"
      - "sombra"
      - "lich"
      - "dragón"
      - "dragon"

    # 3. Tipos de mobs boss vanilla considerados bosses automáticamente
    auto-boss-entity-types:
      - "WARDEN"
      - "WITHER"
      - "ENDER_DRAGON"
      - "ELDER_GUARDIAN"

    # 4. Umbral de vida máxima (mobs agresivos con >= 100 HP / 50 corazones)
    min-health-threshold: 100.0
    require-monster-for-health: true

    # 5. Filtro de mundos opcional (si está enabled: false, aplica en todos los mundos)
    world-filter:
      enabled: false
      worlds:
        - "dungeon"
        - "dungeon1"
        - "dungeon2"
        - "mazmorra"
        - "game_world_"


# ==========================================
# Módulo: Chat Bubbles (Globos de Texto Estilo Cómic)
# ==========================================
chat-bubbles:
  enabled: true
  duration-ticks: 80 # 4 segundos en pantalla
  vertical-offset: 0.95 # Altura sobre los ojos (~2.6 bloques desde el suelo)
  max-chars-per-line: 32
  max-lines: 3
  crowd-limit:
    # Si hay más de max-players juntos en el radio, no se muestra ningún globo para evitar saturar la pantalla
    enabled: true
    max-players: 15
    radius: 15.0
  disabled-players: []

# ==========================================
# 21. MÓDULO: FILTRO DE GROSERÍAS INTELIGENTE & SISTEMA DE MUTES
# ==========================================
chat-filter:
  enabled: true

  # Sistema de Advertencias (Strikes) antes del Mute
  max-strikes: 3

  # Duración del Mute automático al alcanzar los 3 strikes (en minutos)
  mute-duration-minutes: 25

  # Permiso para ignorar el filtro (Staff/Admins)
  bypass-permission: "alcatraz.chatfilter.bypass"
  # Si es false, los operadores también están sujetos al filtro (ideal para pruebas)
  bypass-ops: true

  # Permiso para gestionar mutes y desmutear (/alcatraz unmute)
  admin-permission: "alcatraz.chatfilter.admin"

  # Notificar al Staff conectado cuando un jugador comete una infracción
  notify-staff: true

  # Sonido opcional al recibir una advertencia o mute (vacío para desactivar)
  warning-sound: "ENTITY_VILLAGER_NO"
  mute-sound: "ENTITY_ENDER_DRAGON_GROWL"

  # Mensajes configurables con soporte para códigos de color (&)
  messages:
    prefix: "&8[&c&lFILTRO&8] "
    strike-warn: "&eTu mensaje fue bloqueado por contener vocabulario inapropiado. &cAdvertencia: &e[&c%strike%&e/&c%max%&e]"
    strike-final-warn: "&c¡Atención! Al próximo intento serás silenciado durante &4%duration% minutos&c."
    muted-notice: "&4&l¡SILENCIADO! &cHas acumulado %max% advertencias de malas palabras. Estás silenciado por &e%duration% minutos&c."
    still-muted: "&cEstás silenciado por acumular advertencias de groserías. &eTiempo restante: &f%time%"
    unmuted-target: "&a¡Un administrador te ha levantado el silencio! Puedes hablar de nuevo en el chat."
    unmuted-sender: "&aHas desmuteado exitosamente al jugador &e%player%&a."
    not-muted: "&eEl jugador &f%player% &eno está silenciado."
    staff-strike-alert: "&8[&cAlerta Staff&8] &e%player% &cintentó usar groserías &7(%strike%/%max%)&c: &f%message%"
    staff-mute-alert: "&8[&cAlerta Staff&8] &e%player% &4ha sido silenciado automáticamente por %duration% minutos tras %max% faltas."

# ==========================================
# 22. MÓDULO: ANTI-FLOOD DE CHAT
# ==========================================
anti-flood:
  enabled: true
  # Si es false, los operadores también están sujetos a cooldown (ideal para pruebas)
  bypass-ops: true
  # Cooldown entre mensajes de chat en segundos (0.0 = desactivado, fluido total)
  chat-cooldown-seconds: 0.0
  # Bloquear repetición consecutiva de mensajes idénticos
  block-duplicates: true
  duplicate-cooldown-seconds: 2
  # Recortar caracteres alargados excesivos (ej. 'holaaaaaaaa' -> 'holaaa')
  trim-repeated-characters: true
  max-repeat-characters: 3

# ==========================================
# 23. MÓDULO: ANTI-SPAM (ENLACES, IPS, DISCORD Y RÁFAGAS)
# ==========================================
anti-spam:
  enabled: true
  # Si es false, los operadores también están sujetos al filtro de spam (ideal para pruebas)
  bypass-ops: true
  bypass-permission: "alcatraz.antispam.bypass"
  admin-permission: "alcatraz.antispam.admin"
  notify-staff: true
  warning-sound: "ENTITY_VILLAGER_NO"

  # Bloquear enlaces web (http, https, dominios .com, .net, etc.)
  block-links: true
  # Bloquear direcciones IP numéricas
  block-ips: true
  # Bloquear invitaciones de Discord
  block-discord: true
  # Bloquear spam de caracteres o símbolos repetidos (???????, !!!!!!!, etc.)
  block-symbol-spam: true
  max-symbols-percentage: 65.0

  # Protección contra ráfagas (Burst spam: enviar demasiados mensajes en pocos segundos)
  burst:
    enabled: true
    max-messages: 6
    window-seconds: 3.0

  # Dominios o IPs permitidos en el chat (Whitelist)
  whitelist:
    - "dal01.qorehost.com"
    - "localhost"
    - "127.0.0.1"

  messages:
    prefix: "&8[&c&lSPAM&8] "
    blocked-link: "&cNo está permitido enviar enlaces o sitios web en el chat."
    blocked-ip: "&cNo está permitido publicar direcciones IP o servidores en el chat."
    blocked-discord: "&cNo está permitido enviar invitaciones de Discord en el chat."
    blocked-burst: "&cEstás enviando demasiados mensajes seguidos. ¡Por favor espera un momento!"
    blocked-symbols: "&cTu mensaje contiene demasiados símbolos o caracteres repetidos."
    staff-alert: "&8[&cAlerta Staff&8] &e%player% &cbloqueado por spam/enlace: &f%message%"

# ==========================================
# 24. MÓDULO: ANTI-MAYÚSCULAS (ANTI-CAPS)
# ==========================================
anti-caps:
  enabled: true
  # Si es false, los operadores también están sujetos a la corrección de mayúsculas (ideal para pruebas)
  bypass-ops: true
  bypass-permission: "alcatraz.anticaps.bypass"
  # Longitud mínima del mensaje para evaluar mayúsculas
  min-message-length: 5
  # Máximo de palabras COMPLETAS en mayúsculas permitidas por mensaje (el resto se pasa a minúsculas)
  max-uppercase-words: 1
  # Porcentaje máximo de mayúsculas antes de activar el filtro automático
  max-caps-percentage: 50.0

# ==========================================
# 25. MÓDULO: RESOURCE PACK MANAGER & BEDROCK FIX
# ==========================================
resource-pack:
  # Activar el gestor avanzado de paquetes de texturas
  enabled: true

  # URL directa HTTP/HTTPS al archivo .zip del Resource Pack (Java)
  url: ""

  # Hash SHA-1 de 40 caracteres hexadecimales para verificación de caché del cliente
  hash: ""

  # Si es true, cuando actualices el hash arriba, el plugin detectará la nueva versión
  # y volverá a pedirlo 1 sola vez a todos los usuarios elegibles.
  reset-on-hash-change: true

  # Modo de destino de los jugadores:
  # "PERMISSION": Solo los jugadores con el permiso configurado abajo lo recibirán
  # "WHITELIST": Solo los jugadores listados en 'whitelist' lo recibirán
  # "ALL": Todos los jugadores de Java lo recibirán
  target-mode: "PERMISSION"

  # Permiso requerido si target-mode es "PERMISSION"
  permission: "alcatraz.pack.receive"

  # Lista de usuarios si target-mode es "WHITELIST"
  whitelist:
    - "UsuarioEjemplo"

  # DESCARGA ÚNICA (SEND-ONLY-ONCE):
  # Si es true, una vez que el jugador lo descarga con éxito, AlcatrazCore guarda su UUID
  # y NUNCA más se lo vuelve a enviar al entrar.
  # Esto EVITA completamente la pantalla de "Cargando recursos" y congelamientos en cada inicio de sesión.
  send-only-once: true

  # Tiempo de espera (en ticks) tras unirse al servidor antes de enviar la solicitud (20 ticks = 1 segundo)
  delay-ticks: 30

  # Mensaje que se muestra en la pantalla de confirmación de descarga del cliente
  prompt: "&b&lAlcatraz &8» &7Descargando paquete de texturas oficial..."

  # Forzar descarga (si es true, el cliente no puede rechazar la pantalla de aviso)
  force: false

  # Expulsar al jugador si rechaza el paquete de recursos (solo si no tiene alcatraz.pack.bypass)
  kick-on-decline: false
  decline-kick-message: "&cDebes aceptar el paquete de recursos para ingresar al servidor."

  # ----------------------------------------------------------
  # AISLAMIENTO Y COMPATIBILIDAD CON BEDROCK EDITION (GEYSER / FLOODGATE)
  # ----------------------------------------------------------
  bedrock:
    # Si es true, a los jugadores de Bedrock NUNCA se les enviará el paquete de Java.
    # Esto elimina al 100% los errores de "Cargando paquete de recursos", bloqueos infinitos
    # o desconexiones en móviles y consolas al conectarse mediante Geyser.
    bypass-java-pack: true

    # URL opcional exclusiva para Bedrock (enlace directo a .mcpack si se cuenta con uno).
    # Dejar vacío si Geyser ya maneja las texturas automáticamente desde su carpeta 'packs'.
    custom-pack-url: ""
    custom-pack-hash: ""

    # Notificar al jugador de Bedrock por chat que sus texturas están gestionadas por Geyser
    notify-pack-info: false
    info-message: "&e[Alcatraz] &7Texturas de Bedrock optimizadas por Geyser. ¡Sin lag ni descargas pesadas!"

# ==========================================================
# 27. MÓDULO: ANTI-XRAY INTELIGENTE & HEURÍSTICA DE MINERÍA
# ==========================================================
antixray:
  enabled: true
  ratio-threshold-percent: 8.0
  fast-ore-count-threshold: 5
  analysis-window-seconds: 120
  alert-cooldown-seconds: 45

# ==========================================================
# 28. MÓDULO: GANCHO DE AGARRE (GRAPPLING HOOK TÁCTICO)
# ==========================================================
grapplinghook:
  enabled: true
  pull-multiplier: 1.65
  vertical-boost: 0.35
  cooldown-seconds: 2.0
  default-uses: 50


# ==========================================================
# 32. MÓDULO: EVENTO DE HALLOWEEN
# ==========================================================
halloween:
  enabled: true
  world: "world"
  grid:
    # Tamaño de cada región en bloques (3000 = ~187 chunks)
    region-size: 3000
    # Cantidad de calabazas a sembrar por región (600 = ~1 calabaza cada 4-5 chunks)
    heads-per-region: 600
    # Separación mínima en bloques entre cabezas del evento
    min-distance-between-heads: 12
    weights:
      caves: 45
      surface: 55




