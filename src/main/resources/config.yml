# ----------------------------------------------------------
# 1. MÓDULO: HOJA SÓNICA (SONIC BLADE / GRITO DEL CENTINELA)
# ----------------------------------------------------------
arma:
  nombre: "&b&lGrito del Centinela"
  custom-model-data: 12345
  lore:
    - "&7¡El eco del abismo concentrado!"
    - "&8▪ &7Habilidad: &bOnda Sónica de Warden"
    - "&eClick derecho para desatar el ataque."

habilidad:
  danio: 15.0
  rango: 25.0
  radio-hitbox: 3.0
  cooldown-segundos: 5
  duracion-oscuridad-ticks: 200
  respetar-protecciones-claims: true

mensajes-hojasonica:
  prefijo: "&8[&bSonicBlade&8] &r"
  recibida: "&aHas recibido el &b&lGrito del Centinela&a."
  entregada: "&aLe has entregado la espada a &e%jugador%&a."
  sin-permiso-uso: "&cNo dominas el poder de esta arma."
  cooldown: "&c¡Recargando! Espera %tiempo%s."
  protegido: "&eEl objetivo está protegido en esta zona."
  sin-permiso: "&cNo tienes permisos para ejecutar este comando."
  jugador-no-encontrado: "&cJugador no encontrado o desconectado."
  recargado: "&a¡Configuración recargada con éxito!"
  solo-jugadores: "&cEste comando solo puede ser usado por jugadores."

# ----------------------------------------------------------
# 2. MÓDULO: PECHERA DE NETHERITE ÉLITRA (NETHERITE ELYTRA)
# ----------------------------------------------------------
flight:
  boost-velocity-multiplier: 1.65
  double-jump-to-glide: true
  consume-fireworks: true
  durability-loss-on-boost: 1
  durability-loss-gliding-interval-ticks: 40
  min-durability-to-glide: 5

anvil:
  exp-level-cost: 5

items:
  book:
    name: "&6&lLibro Encantado: &d&lAlas del Inframundo"
    lore:
      - "&7Otorga la habilidad de &bplanear y volar"
      - "&7e impulsarse con &ecohetes pirotécnicos&7."
      - ""
      - "&c&lRestricción:"
      - "&8▪ &7Solo aplicable a: &5&lPechera de Netherite"
      - ""
      - "&eCombina en un yunque con una pechera de netherite."
  chestplate:
    name: "&5&lPechera de Netherite &d[Élitra]"
    enchantment-tag-lore: "&b✦ Propulsión de Élitra Integrada ✦"
    extra-lore-line: "&7Presiona doble espacio en el aire para planear y usa cohetes."

messages-elytra:
  prefix: "&8[&5Netherite&dElytra&8] &r"
  no-permission: "&cNo tienes permisos para usar este comando."
