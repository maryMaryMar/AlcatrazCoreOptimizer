  book-given-target: "&aHas entregado &e%amount%x &6libro(s) a &e%player%&a."
  chestplate-given: "&aHas recibido &e%amount%x &5Pechera de Netherite con Élitra&a."
  chestplate-given-target: "&aHas entregado &e%amount%x &5pechera(s) a &e%player%&a."
  player-not-found: "&cEl jugador no fue encontrado o está desconectado."
  reload-success: "&a¡Configuración recargada correctamente!"
  only-players: "&cEste comando solo puede ser ejecutado por jugadores dentro del juego."
  chestplate-broken: "&c¡Tu pechera tiene muy poca durabilidad para volar!"
  inventory-full: "&e¡Tu inventario estaba lleno! Los objetos se soltaron en el suelo."

# ----------------------------------------------------------
# 3. MÓDULO: LIFE MENDING (REPARACIÓN VITAL CON VIDA/SATURACIÓN)
# ----------------------------------------------------------
life-mending:
  enabled: true
  consumption-mode: "SATURATION_THEN_HEALTH"
  durability-per-cycle: 1
  repair-interval-ticks: 20
  health-cost-per-durability: 0.5
  saturation-cost-per-durability: 0.5
  food-cost-per-durability: 1
  min-health-threshold: 4.0
  repair-all-inventory-items: false
  particles-enabled: true
  sound-enabled: true

  anvil:
    exp-level-cost: 5

  book:
    name: "&c&lLibro Encantado: &4&lLife Mending"
    lore:
      - "&7Repara la durabilidad de cualquier objeto"
      - "&7consumiendo la &cvida &7y la &esaturación &7del portador."
      - ""
      - "&c&lCompatibilidad Universal:"
      - "&8▪ &7Aplicable a: &aCualquier objeto o herramienta con durabilidad"
      - ""
      - "&eCombina en un yunque con cualquier herramienta, arma o armadura."

  enchantment-tag-lore: "&c✦ Life Mending ✦"
  extra-lore-line: "&7Repara su durabilidad consumiendo tu vida y saturación."

messages-lifemending:
  prefix: "&8[&4Life&cMending&8] &r"
  no-permission: "&cNo tienes permisos para usar este comando."
  book-given: "&aHas recibido &e%amount%x &cLibro Encantado de Life Mending&a."
  book-given-target: "&aHas entregado &e%amount%x &clibro(s) de Life Mending a &e%player%&a."
  player-not-found: "&cEl jugador no fue encontrado o está desconectado."
  reload-success: "&a¡Configuración de Life Mending recargada correctamente!"
  only-players: "&cEste comando solo puede ser ejecutado por jugadores dentro del juego."
  inventory-full: "&e¡Tu inventario estaba lleno! Los libros se soltaron en el suelo."

# ----------------------------------------------------------
# 4. MÓDULO: ELEVADORES (ELEVATORS)
# ----------------------------------------------------------
elevator:
  enabled: true
  max-distance: 400
  sound: "ENTITY_ENDERMAN_TELEPORT"
  block-materials:
    - IRON_BLOCK
    - GOLD_BLOCK
    - DIAMOND_BLOCK
    - EMERALD_BLOCK
    - COPPER_BLOCK

# ----------------------------------------------------------
# 6. MÓDULO: VOIDSPAWN (RESCATE DE CAÍDA AL VACÍO PARA NUEVOS USUARIOS)
# ----------------------------------------------------------
void-spawn:
  enabled: true
  activation-y: -60
  # Si es true, solo los jugadores que aún tengan activa su Protección de Nuevo Usuario serán rescatados
  require-newbie-protection: true
  worlds:
    - "world"
    - "world_nether"
    - "world_the_end"

messages-voidspawn:
  title: "&c&l¡SALVADO DEL VACÍO!"
  subtitle: "&7Protección de Nuevo Usuario activa (&e48h&7)."
  saved: "&8[&bAlcatraz&cOptimizer&8] &e¡Has caído al vacío! Has sido rescatado por tu Protección de Nuevo Usuario."

# ----------------------------------------------------------
# 7. MÓDULO: PROTECCIÓN DE NUEVO USUARIO (ANTI-PVP Y RESCATE DE VACÍO)
# ----------------------------------------------------------
newbie-protection:
  enabled: true
  # Duración de la protección de nuevo usuario en horas (48 horas)
  duration-hours: 48
  duration-minutes: 2880

# ----------------------------------------------------------
# 8. MÓDULO: SISTEMA DE PROTECCIONES Y CLAIMS POR BLOQUES (PS)
# ----------------------------------------------------------
protections:
  enabled: true
  max-claims-per-player: 5
  temporary-duration-days: 7
  # Cobertura vertical total: Protege desde Y: -64 hasta Y: 320 (Bedrock a Cielo)
  full-height-coverage: true
  # Avisos en pantalla al cruzar las fronteras del terreno (ActionBar)
  show-entry-exit-messages: true
  # Bloqueo de invasión con pistones y líquidos exteriores
  prevent-piston-grief: true
  prevent-liquid-grief: true

# ----------------------------------------------------------
# 8.1. MÓDULO: CANDADOS PRIVADOS PARA COFRES Y PUERTAS (LOCKETTE)
# ----------------------------------------------------------
chest-lock:
  enabled: true
  # Auto-cierre automático de puertas tras abrirse (en segundos)
  door-auto-close: true
  default-door-timer-seconds: 3
  # Protección contra tolvas de extracción
  anti-hopper-steal: true
  # Protección contra explosiones de TNT/Creepers en contenedores privados
  anti-explosion: true

# ----------------------------------------------------------
# 9. MÓDULO: COMBATLOG (ANTI-ESCAPE EN PVP)
# ----------------------------------------------------------
combat-log:
  enabled: true
  duration-seconds: 15
  blocked-commands:
    - "/rtp"
    - "/spawn"
    - "/home"
    - "/tpa"
    - "/tpahere"
    - "/pv"
    - "/vault"
    - "/claim"
    - "/fly"
    - "/wild"
    - "/back"


# ----------------------------------------------------------
# 11. MÓDULO: AUTO-ANNOUNCER (CONSEJOS Y AVISOS)
# ----------------------------------------------------------
announcer:
  enabled: true
  interval-seconds: 300
  messages:
    - "&8[&bAlcatraz&8] &7¡Protege tu terreno de 80 a 150 bloques con &e/claim create <nombre>&7!"
    - "&8[&bAlcatraz&8] &7¿Tienes basura acumulada? Usa &e/trash &7para destruirla al instante sin generar lag."
    - "&8[&bAlcatraz&8] &7¡Consigue la poderosa &b&lHoja Sónica &7o la &5&lPechera con Élitra &7del inframundo!"
    - "&8[&bAlcatraz&8] &7Optimiza tus granjas evitando acumular más de 20 animales por chunk."

# ----------------------------------------------------------
# 12. SUITE DE OPTIMIZACIÓN Y CONTROL DE MEMORIA RAM
# ----------------------------------------------------------
optimizer:
  # A. Descargador de Chunks de Paso Rápido (Fly-by / Transient Chunks)
  transient-chunks:
    enabled: true
    unload-delay-seconds: 5
    check-radius-blocks: 64

  # B. Optimizador de Granjas (FarmControl AI)
  farm-control:
    enabled: true
    check-interval-ticks: 60
    crowd-threshold: 6
    crowd-radius: 2.5
    affected-mobs:
      - COW
      - SHEEP
      - PIG
      - CHICKEN
      - VILLAGER
      - ZOMBIE
      - SKELETON
      - ENDERMAN
      - ZOMBIFIED_PIGLIN
      - IRON_GOLEM

  # C. Optimizador Inteligente de Aldeanos (Trading Halls AI Freeze)
  villagers:
    enabled: true
    check-interval-ticks: 100
    optimize-stationary-only: true

  # D. Anti-Lag de TNT y Bloques que Caen
  tnt:
    enabled: true
    max-primed-tnt-per-chunk: 25
    max-falling-blocks-per-chunk: 40
    optimize-explosions: true
    max-explosion-blocks: 150

  # F. Colisiones Físicas Selectivas (Anti-Cramming Lag)
  collisions:
    enabled: true

  # G. Límite Duro de Mobs por Chunk
  chunk-hard-cap:
    enabled: true
    max-animals-per-chunk: 25
    max-monsters-per-chunk: 40

  # H. Fusión de Experiencia (XP Stacker & Absorción Rápida)
  xp-stacker:
    enabled: true
    merge-radius: 4.0

  # I. Fusión de Ítems en el Suelo (Item Stacker)
  items:
    stacker-enabled: true
    merge-radius: 3.0

  # J. Limpieza Rápida de Flechas y Proyectiles Clavados
  projectiles:
    fast-despawn-arrows: true
    arrow-lifetime-ticks: 100

  # K. Protección contra Relojes de Redstone
  redstone:
    anti-lag-clocks: true
    max-pulses-per-second: 60

# ----------------------------------------------------------
# 13. MENSAJES GENERALES Y LIMPIEZA DE PARTÍCULAS
# ----------------------------------------------------------
messages-particulas:
  prefix: "&8[&bAlcatraz&cOptimizer&8] "
  cleared: "&a¡Se han eliminado &e%count% &anubes de partículas/efectos del servidor!"

